global:
  resolve_timeout: 30s
route:
  receiver: observe-only
  group_by: [alertname, instance]
  group_wait: 2s
  group_interval: 5s
  repeat_interval: 5m
  routes:
    - receiver: internal-recovery
      matchers:
        - alertname="ServiceDeskUnavailable"
        - service="servicedesk"
        - container="cloudguard-servicedesk"
        - job="servicedesk-http"
receivers:
  - name: observe-only
  - name: internal-recovery
    webhook_configs:
      - url: http://recovery:8081/alerts
        send_resolved: true
        max_alerts: 10
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/recovery_token
